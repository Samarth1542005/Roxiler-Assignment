services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: store_ratings
      POSTGRES_USER: ratings
      POSTGRES_PASSWORD: ratings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratings -d store_ratings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
